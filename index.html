<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OurWebsite</title>
  <link rel="icon" href="favicon.JPG">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">OUR</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#ourbot">OurBot</a>
      <a href="#ourserver">OurServer</a>
      <a href="#oursign">OurSign</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero">
      <h1>Welcome to OUR</h1>
      <p>One ecosystem. Many projects.</p>
      <button onclick="showMessage()">Explore OUR</button>
    </section>

    <section class="projects">
      <div class="card" id="ourbot">
        <h2>OurBot</h2>
        <p>Powering your Discord server.</p>
      </div>

      <div class="card" id="ourserver">
        <h2>OurServer</h2>
        <p>The home of the OUR community.</p>
      </div>

      <div class="card" id="oursign">
        <h2>OurSign</h2>
        <p>OUR signing project.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 OUR</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
